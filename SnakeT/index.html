<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>SnakeT-Handsome</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="game-container">
    <h1>SnakeT-Handsonme</h1>

    <div class="game-info">
        <span>Level: 1</span>
        <span id="score">Food: 0 / 20</span>
        <span id="status">Ready</span>
    </div>
    <div class="game-settings" id="game-settings">
        <h2>Game Settings</h2>

        <label for="level-select">Level</label>
        <select id="level-select">
            <option value="1">Level 1</option>
            <option value="2" disabled>Level 2</option>
            <option value="3" disabled>Level 3</option>
            <option value="4" disabled>Level 4</option>
            <option value="5" disabled>Level 5</option>
            <option value="6" disabled>Level 6</option>
        </select>

        <label for="snake-length">Snake Length</label>
        <input type="number" id="snake-length"
               min="3" max="10" value="3">

        <label for="game-speed">Speed (ms)</label>
        <input type="number" id="game-speed"
               min="50" max="300" step="10" value="200">
    </div>
    <div id="game-board"></div>

    <div class="game-controls">
        <button id="start-btn">Start</button>
        <button id="pause-btn">Pause</button>
        <button id="restart-btn">Restart</button>
    </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
